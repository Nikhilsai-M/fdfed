services:
  mongo:
    image: mongo:7
    container_name: fdfed-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fdfed-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5


  solr:
    image: solr:9
    container_name: fdfed-solr
    restart: unless-stopped
    ports:
      - "8983:8983"
    command: ["solr-precreate", "smart_exchange"]
    volumes:
      - solr_data:/var/solr
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8983/solr/admin/cores?action=STATUS"]
      interval: 15s
      timeout: 10s
      retries: 8
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: fdfed-api
    restart: unless-stopped
    working_dir: /app/api
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      PORT: 3000
      REDIS_URL: redis://redis:6379
      SEARCH_ENGINE: ${SEARCH_ENGINE:-solr}
      SOLR_URL: http://solr:8983/solr
      SOLR_CORE: smart_exchange
      CLIENT_ORIGIN: http://localhost:5173
      SWAGGER_SERVER_URL: http://localhost:3000
    volumes:
      - .:/app
      - /app/api/node_modules
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      solr:
        condition: service_healthy
    command: npm run dev

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: fdfed-client
    restart: unless-stopped
    working_dir: /app/client
    ports:
      - "5173:5173"
    environment:
      VITE_API_PROXY_TARGET: http://api:3000
    volumes:
      - .:/app
      - /app/client/node_modules
    depends_on:
      - api
    command: npm run dev -- --host 0.0.0.0

volumes:
  mongo_data:
  redis_data:
  solr_data:


